<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BalandraLabs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4CAF50, #8BC34A);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        p.tagline {
            color: #9e9e9e;
            font-size: 1.1rem;
            margin-bottom: 48px;
            text-align: center;
        }

        .proyecto {
            background-color: #151515;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 24px 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        .proyecto h2 {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: #4CAF50;
        }

        .proyecto p {
            color: #b0b0b0;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .proyecto-links {
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .proyecto-links a {
            color: #4CAF50;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .proyecto-links a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 64px;
            color: #666;
            font-size: 0.85rem;
        }

        footer a {
            color: #4CAF50;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>BalandraLabs</h1>
    <p class="tagline">Aplicaciones móviles pequeñas, hechas con cuidado.</p>

    <div class="proyecto">
        <h2>Batalla de Auras</h2>
        <p>Descubre tu "aura" con la cámara — inspirado en la tendencia de las batallas de aura.</p>
        <div class="proyecto-links">
            <a href="/batalla-de-auras/acerca.html">Acerca de</a>
            <a href="/batalla-de-auras/privacidad.html">Política de Privacidad</a>
        </div>
    </div>

    <footer>
        Contacto: <a href="mailto:admin@balandralabs.com">admin@balandralabs.com</a>
    </footer>
</body>
</html>
